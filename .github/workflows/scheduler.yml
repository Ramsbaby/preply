# DEPRECATED: 이 파일의 cron 스케줄은 비활성화됨.
# 각 액션별 전용 워크플로우로 분리됨:
#   - daily-ingest.yml  (매일 09:00 KST)
#   - daily-summary.yml (매일 23:05 KST)
#   - weekly-ingest.yml (매주 월요일 15:00 KST)
#
# 수동 테스트용 workflow_dispatch는 아래 각 파일에서 직접 실행하세요.
name: Preply Scheduler (DEPRECATED)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run (use dedicated workflow files instead)'
        required: true
        default: 'test'
        type: choice
        options:
          - test

jobs:
  call-preply-api:
    runs-on: ubuntu-latest
    steps:
      - name: Get GCP Identity Token
        id: auth
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts > /dev/null 2>&1
          source ~/google-cloud-sdk/path.bash.inc
          gcloud auth activate-service-account --key-file=/tmp/sa.json
          TOKEN=$(gcloud auth print-identity-token --audiences="${{ secrets.CLOUD_RUN_URL }}")
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          rm /tmp/sa.json

      - name: Health check
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            "${{ secrets.CLOUD_RUN_URL }}/actuator/health")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Code: $HTTP_CODE"
          echo "Body: $BODY"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Health OK"
          else
            echo "❌ Failed with HTTP $HTTP_CODE"
            exit 1
          fi
