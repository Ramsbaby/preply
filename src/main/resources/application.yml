app:
  mail:
    user: ${APP_MAIL_USER:}
    pass: ${APP_MAIL_PASS:}
    imap:
      host: ${APP_MAIL_IMAP_HOST:imap.naver.com}
      port: ${APP_MAIL_IMAP_PORT:993}
    smtp:
      host: ${APP_MAIL_SMTP_HOST:smtp.naver.com}
      port: ${APP_MAIL_SMTP_PORT:465}
      from: ${APP_MAIL_FROM:}
      to: ${APP_MAIL_TO:}
  webhook:
    slackUrl: ${APP_WEBHOOK_SLACK_URL:}
  gcal:
    credentialsPath: ${APP_GCAL_CREDENTIALS_PATH:}
    calendarId: ${APP_GCAL_CALENDAR_ID:}
    timeZone: ${APP_GCAL_TZ:Asia/Seoul}
    preplySuffix: ${APP_GCAL_PREPLY_SUFFIX:" - Preply lesson"}
    lookBackDays: ${APP_GCAL_LOOKBACK_DAYS:90}
  supabase:
    enabled: ${APP_SUPABASE_ENABLED:true}
    # Supabase(PostgreSQL) 테이블명. enabled=true일 때만 사용됩니다.
    table: ${APP_SUPABASE_TABLE:preply_mail}
  run:
    token: ${APP_RUN_TOKEN:}
  scheduler:
    enabled: ${APP_SCHEDULER_ENABLED:true}
  autorun: false

spring:
  mail:
    host: ${app.mail.smtp.host}
    port: ${app.mail.smtp.port}
    username: ${app.mail.user}
    password: ${app.mail.pass}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.starttls.enable: false
  datasource:
    # 기본값은 H2(in-memory, PostgreSQL 모드)로 안전하게 구동
    url: ${DATABASE_URL:jdbc:h2:mem:preply;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

    # HikariCP Connection Pool 설정
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
      connection-timeout: 10000
      idle-timeout: 120000
      max-lifetime: 300000
      leak-detection-threshold: 60000
      register-mbeans: true

server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
